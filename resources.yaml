---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: quickzhiin
spec:
  domains:
    - zenzhiin.com
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: quickzhiin
spec:
  redirectToHttps:
    enabled: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quickzhiin
  annotations:
    kubernetes.io/ingress.class: 'gce'
    kubernetes.io/ingress.global-static-ip-name: quickzhiin
    networking.gke.io/v1beta1.FrontendConfig: quickzhiin
    networking.gke.io/managed-certificates: quickzhiin
spec:
  defaultBackend:
    service:
      name: quickzhiin
      port:
        number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: quickzhiin
spec:
  type: NodePort
  selector:
    app: quickzhiin
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickzhiin
  labels:
    app: quickzhiin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quickzhiin
  template:
    metadata:
      labels:
        app: quickzhiin
    spec:
      containers:
        - name: quickzhiin
          image:
